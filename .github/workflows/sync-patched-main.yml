name: Sync patched main

on:
  push:
    branches:
      - patch-source
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: sync-patched-main
  cancel-in-progress: true

env:
  GHCR_IMAGE: ghcr.io/xiaolrrr/cpa-manager-plus

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rebuild patched main
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote add upstream https://github.com/seakee/CPA-Manager-Plus.git
          git fetch --no-tags --depth=1 upstream +refs/heads/main:refs/remotes/upstream/main
          git fetch --no-tags --depth=20 origin +refs/heads/patch-source:refs/remotes/origin/patch-source
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          old_main="$(git rev-parse origin/main)"

          git switch --force-create main upstream/main
          git cherry-pick aed736709acc63fd389643d8bec3b8077cebccd2
          git rm .github/workflows/docker-branch.yml
          git show origin/patch-source:.github/workflows/sync-patched-main.yml \
            > .github/workflows/sync-patched-main.yml
          git show origin/patch-source:.github/workflows/patched-release.yml \
            > .github/workflows/patched-release.yml
          git add .github/workflows
          git commit -m 'ci: sync patched main from upstream'

          echo "old_main=${old_main}" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && \
             [ "$(git rev-parse HEAD^{tree})" = "$(git rev-parse origin/main^{tree})" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.patch.outputs.changed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        if: steps.patch.outputs.changed == 'true'
        run: npm ci

      - name: Test PAT import patch
        if: steps.patch.outputs.changed == 'true'
        run: npm --workspace apps/web exec vitest run src/features/authFiles/codexPat.test.ts

      - name: Build production panel
        if: steps.patch.outputs.changed == 'true'
        run: npm run build

      - name: Setup Docker Buildx
        if: steps.patch.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.patch.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push main image
        if: steps.patch.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.manager-server
          push: true
          tags: |
            ${{ env.GHCR_IMAGE }}:main
            ${{ env.GHCR_IMAGE }}:main-${{ steps.patch.outputs.short_sha }}
            ${{ env.GHCR_IMAGE }}:codex-pat
          cache-from: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache,mode=max
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false

      - name: Publish fork main
        if: steps.patch.outputs.changed == 'true'
        run: git push --force-with-lease=refs/heads/main:${{ steps.patch.outputs.old_main }} origin HEAD:main
